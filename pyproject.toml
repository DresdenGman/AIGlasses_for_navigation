[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-glasses-navigation-prototype"
# Runnable software prototype. Not the enclosure label (design v0.4).
version = "0.1.0"
description = "A safety-conscious AI glasses navigation prototype with a hardware-free demo and an optional laptop camera path"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi>=0.110,<1.0",
    "python-dotenv>=1.0,<2.0",
    "uvicorn[standard]>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<10.0",
]
vision = [
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
]
audio = [
    "edge-tts>=6.1,<8",
    "pyttsx3>=2.90,<3",
]

[tool.setuptools.packages.find]
include = ["aiglasses*"]

[tool.setuptools.package-data]
"aiglasses.eval" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
