name: Test prototype

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is requires-python in pyproject.toml. Keep this list in sync.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev,vision]'
      # Installation verifies the distributable package; `python -m` keeps
      # the invocation consistent with local development.
      - run: python -m pytest -p no:cacheprovider
      # Generated lamp fixtures only. No weight download. Exit 1 if locked counts move.
      - run: python -m aiglasses.eval --output demo_output/perception_eval.json --csv demo_output/perception_eval.csv
      # No private clip is in the repo. Exit 0 when data/private_eval/labels.json is absent.
      # Does not download weights and does not read a recording.
      - run: python -m aiglasses.eval.recorded
