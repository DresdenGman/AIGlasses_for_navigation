name: Test prototype

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor is requires-python in pyproject.toml. Keep this list in sync.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[dev]'
      # Installation verifies the distributable package; `python -m` keeps
      # the invocation consistent with local development.
      - run: python -m pytest -p no:cacheprovider
