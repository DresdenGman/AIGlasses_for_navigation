name: Test prototype

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install .[dev]
      # Installation verifies the distributable package; `python -m` keeps
      # the invocation consistent with local development.
      - run: python -m pytest -p no:cacheprovider
