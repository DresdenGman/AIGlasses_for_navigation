[package]
name = "lifelog"
version = "0.1.0"
description = "AI Glasses Lifelog companion app (front-end demo shell)"
authors = ["DresdenGman"]
edition = "2021"

[lib]
name = "lifelog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
