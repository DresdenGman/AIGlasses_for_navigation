[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aiglasses-lifelog"
version = "0.1.0"
description = "Experimental, opt-in research-prototype lifelog companion. Not a navigation aid and not a certified assistive product."
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["aiglasses_lifelog*"]
